<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app & Movie search app</title>
    <style>
        /* CSS3 Modern Styling & Responsive Layout */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 1rem;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .section.active {
            display: block;
        }

        form {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input {
            flex: 1;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus { border-color: var(--primary); }

        button.submit-btn {
            padding: 0 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button.submit-btn:hover { background: var(--primary-hover); }

        /* Weather UI */
        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
        }

        .weather-temp { font-size: 4rem; font-weight: 700; margin: 1rem 0; }
        .weather-details { display: flex; justify-content: space-around; margin-top: 2rem; flex-wrap: wrap; gap: 1rem; }
        .detail-item p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.3rem;}
        .detail-item h3 { font-size: 1.2rem; }

        /* Movie UI */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .movie-card:hover { transform: translateY(-5px); }
        .movie-poster { width: 100%; height: 320px; object-fit: cover; }
        .movie-info { padding: 1.2rem; }
        .movie-title { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .movie-meta { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; }

        /* Status Messages */
        .loader { text-align: center; color: var(--text-muted); padding: 2rem; }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); padding: 1rem; border-radius: 8px; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            form { flex-direction: column; }
            button.submit-btn { padding: 1rem; }
            .weather-details { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Weather & Movie App</h1>
            <nav class="tabs">
                <button class="tab-btn active" data-target="weather-sec">Weather</button>
                <button class="tab-btn" data-target="movies-sec">Movies</button>
            </nav>
        </header>

        <main>
            <!-- Weather Application Section -->
            <section id="weather-sec" class="section active">
                <form id="weather-form">
                    <input type="text" id="weather-input" placeholder="Search city name (e.g., London, Tokyo)..." required>
                    <button type="submit" class="submit-btn">Search</button>
                </form>
                <div id="weather-output">
                    <div class="loader">Enter a city to get real-time weather data.</div>
                </div>
            </section>

            <!-- Movie Search Application Section -->
            <section id="movies-sec" class="section">
                <form id="movies-form">
                    <input type="text" id="movies-input" placeholder="Search for movies or TV shows..." required>
                    <button type="submit" class="submit-btn">Search</button>
                </form>
                <div id="movies-output" class="movie-grid">
                    <div class="loader" style="grid-column: 1 / -1;">Enter a title to discover movies.</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modular ES6+ Scripting -->
    <script type="module">
        /* 
         * MODULE 1: UI / Tab Controller 
         * Demonstrates: Arrow functions, DOM Manipulation, Event Handling
         */
        const tabs = document.querySelectorAll('.tab-btn');
        const sections = document.querySelectorAll('.section');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        /* 
         * MODULE 2: Weather Application
         * Demonstrates: Async/Await, Fetch API, Destructuring, Template Literals, Error Handling
         */
        const weatherForm = document.getElementById('weather-form');
        const weatherInput = document.getElementById('weather-input');
        const weatherOutput = document.getElementById('weather-output');

        // Helper to translate weather codes to text
        const getWeatherCondition = (code) => {
            const codes = { 0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast', 45: 'Fog', 51: 'Drizzle', 61: 'Rain', 71: 'Snow', 95: 'Thunderstorm' };
            return codes[code] || 'Unknown Conditions';
        };

        const fetchWeather = async (city) => {
            weatherOutput.innerHTML = `<div class="loader">Fetching data...</div>`;
            
            try {
                // Step 1: Geocoding (City Name -> Coordinates)
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=Berlin&count=10&language=en&format=json`);
                if (!geoRes.ok) throw new Error('Network response was not ok');
                const geoData = await geoRes.json();
                
                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error('City not found. Please try a different name.');
                }

                // Destructuring the geographical data
                const { latitude, longitude, name, country } = geoData.results[0];

                // Step 2: Fetching Current Weather using coordinates
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&hourly=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m`);
                const weatherData = await weatherRes.json();

                // Destructuring nested API response
                const { 
                    temperature_2m: temp, 
                    relative_humidity_2m: humidity, 
                    wind_speed_10m: wind, 
                    weather_code: code 
                } = weatherData.current;

                // Dynamic UI Rendering using Template Literals
                weatherOutput.innerHTML = `
                    <div class="weather-card">
                        <h2>${name}, ${country}</h2>
                        <div class="weather-temp">${temp}°C</div>
                        <h3 style="color: var(--primary)">${getWeatherCondition(code)}</h3>
                        
                        <div class="weather-details">
                            <div class="detail-item">
                                <p>Humidity</p>
                                <h3>${humidity}%</h3>
                            </div>
                            <div class="detail-item">
                                <p>Wind Speed</p>
                                <h3>${wind} km/h</h3>
                            </div>
                        </div>
                    </div>
                `;
            } 
            catch (error) {
                // Graceful Error Handling
                weatherOutput.innerHTML = `<div class="error">${error.message}</div>`;
            }

        };

        weatherForm.addEventListener('submit', (e) => {
            e.preventDefault();
            fetchWeather(weatherInput.value.trim());
        });

        /* 
         * MODULE 3: Movie Search Application
         * Demonstrates: Array Mapping, Optional Chaining, Advanced DOM updates
         */
        const moviesForm = document.getElementById('movies-form');
        const moviesInput = document.getElementById('movies-input');
        const moviesOutput = document.getElementById('movies-output');

        const fetchMovies = async (query) => {
            moviesOutput.innerHTML = `<div class="loader" style="grid-column: 1 / -1;">Searching database...</div>`;
            
            try {
                // Fetching from TVMaze API (Public, No Key Required)
                const response = await fetch(`http://img.omdbapi.com/?apikey=[yourkey]&`);
                if (!response.ok) throw new Error('Failed to fetch movie data.');
                const data = await response.json();

                if (data.length === 0) {
                    throw new Error('No movies or shows found for that query.');
                }

                // Render UI based on mapped API response arrays
                moviesOutput.innerHTML = data.map(({ show }) => {
                    // Destructuring with fallbacks and optional chaining
                    const { name, premiered, rating, image } = show;
                    const posterUrl = image?.medium || 'https://via.placeholder.com/210x295/0f172a/6366f1?text=No+Poster';
                    const releaseYear = premiered ? premiered.split('-')[0] : 'N/A';
                    const showRating = rating?.average ? `⭐ ${rating.average}/10` : 'Unrated';

                    return `
                        <div class="movie-card">
                            <img src="${posterUrl}" alt="${name}" class="movie-poster">
                            <div class="movie-info">
                                <h3 class="movie-title">${name}</h3>
                                <div class="movie-meta">
                                    <span>📅 ${releaseYear}</span>
                                    <span>${showRating}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join(''); // Convert array of HTML strings back to a single string

            } catch (error) {
                moviesOutput.innerHTML = `<div class="error" style="grid-column: 1 / -1;">${error.message}</div>`;
            }
        };

        moviesForm.addEventListener('submit', (e) => {
            e.preventDefault();
            fetchMovies(moviesInput.value.trim());
        });

    </script>
</body>
</html>
